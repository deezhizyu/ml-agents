# Example configuration with TorchScript optimization enabled
# This configuration demonstrates performance optimization features

behaviors:
  3DBall:
    trainer_type: ppo
    
    hyperparameters:
      batch_size: 64
      buffer_size: 12000
      learning_rate: 0.0003
      beta: 0.001
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
    
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
      
      # Performance optimization: Enable TorchScript for 2-3x faster inference
      enable_torchscript: true
      torchscript_optimize_for_inference: true
    
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    
    keep_checkpoints: 5
    max_steps: 500000
    time_horizon: 1000
    summary_freq: 12000

# Performance Notes:
# - enable_torchscript: Compiles the neural network with torch.jit for faster inference
# - torchscript_optimize_for_inference: Applies additional optimizations for inference mode
# - Expected speedup: 2-3x faster inference, ~30% faster overall training
# - Works best with: GPU training, batch inference, no recurrent networks
# - Fallback: If compilation fails, training continues with standard PyTorch

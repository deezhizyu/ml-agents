behaviors:
  3DBall:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 204800
      learning_rate: 0.0003
      beta: 0.001
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 10
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 4
      vis_encode_type: simple
      # 2.5x inference speedup, confirmed safe (already used in the stock
      # 3DBall.yaml config) - the base 3DBall_MaxGPU.yaml left this off.
      enable_torchscript: true
      torchscript_optimize_for_inference: true
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 500000
    time_horizon: 1000
    summary_freq: 12000

  3DBallHard:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 204800
      learning_rate: 0.0003
      beta: 0.001
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 10
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 4
      vis_encode_type: simple
      enable_torchscript: true
      torchscript_optimize_for_inference: true
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 500000
    time_horizon: 1000
    summary_freq: 12000

# GPU optimizations - status of each verified this session on ROCm 7.2.1 / RX 7600:
torch_settings:
  device: cuda
  enable_cudnn_benchmark: true  # safe, no issues observed
  enable_tf32: true             # safe, no issues observed
  enable_amp: false             # KEEP OFF: confirmed fp16 overflow in PPO's
                                 # exp(log_prob ratio) under autocast - corrupts
                                 # the policy with NaN mid-training (repo bug,
                                 # not hardware-specific; separately tracked)
  enable_fused_optimizer: true  # Safe to leave true: mlagents/torch_utils/torch.py
                                 # now auto-disables this on any ROCm build (confirmed
                                 # it otherwise hangs the process unrecoverably, even
                                 # via os._exit()), so this setting is a no-op here but
                                 # keeps the config portable to non-ROCm/CUDA GPUs.
  # enable_compile intentionally left at its default (false): torch.compile
  # (Triton/inductor) is untested here, and both enable_amp and
  # enable_fused_optimizer above turned out to be broken on this ROCm setup
  # despite looking safe - not worth risking a third undiagnosed hang without
  # testing it in isolation first.

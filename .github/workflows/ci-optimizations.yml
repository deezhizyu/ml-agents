name: CI Performance Optimizations

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel previous runs if a new push occurs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast linting checks (no dependencies needed)
  lint:
    name: Lint (Black, Flake8, MyPy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            test_requirements.txt
      
      - name: Install linting tools
        run: |
          pip install black flake8 mypy
      
      - name: Run Black
        run: black --check ml-agents ml-agents-envs
      
      - name: Run Flake8
        run: flake8 ml-agents ml-agents-envs
      
      - name: Run MyPy
        run: mypy ml-agents/mlagents ml-agents-envs/mlagents_envs --disallow-incomplete-defs
        continue-on-error: true  # Don't fail on mypy errors yet

  # Unit tests with parallelization
  test-unit:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            test_requirements.txt
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/test_requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ./ml-agents-envs
          pip install -e ./ml-agents
          pip install -r test_requirements.txt
          pip install pytest-xdist  # For parallel test execution
      
      - name: Run unit tests (parallel)
        run: |
          pytest \
            --cov=ml-agents/mlagents \
            --cov=ml-agents-envs/mlagents_envs \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not slow" \
            -n auto \
            --tb=short \
            -v
      
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-unit-tests

  # Integration tests (slow tests) - run separately
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ./ml-agents-envs
          pip install -e ./ml-agents
          pip install -r test_requirements.txt
      
      - name: Run integration tests
        run: |
          pytest -m "slow" --tb=short -v
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/

  # Security and performance tests
  test-security:
    name: Security & Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ./ml-agents-envs
          pip install -e ./ml-agents
          pip install -r test_requirements.txt
      
      - name: Run security tests
        run: |
          pytest \
            ml-agents/mlagents/trainers/tests/test_security.py \
            ml-agents/mlagents/trainers/tests/test_critical_scenarios.py \
            -v --tb=short
      
      - name: Run profiling tests
        run: |
          pytest \
            ml-agents/mlagents/trainers/tests/test_profiling.py \
            -v --tb=short

  # Performance benchmarks (optional, manual trigger)
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ./ml-agents-envs
          pip install -e ./ml-agents
          pip install -r test_requirements.txt
          pip install py-spy
      
      - name: Run profiling benchmarks
        run: |
          python scripts/profile_training.py \
            --config config/ppo/3DBall.yaml \
            --max-steps 1000 \
            --profiler custom
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            training_profile.prof
            results/

# Summary of optimizations in this workflow:
# 1. Concurrency control - cancel old runs
# 2. Pip caching - faster dependency installation
# 3. Parallel test execution - pytest-xdist with -n auto
# 4. Split jobs - lint/unit/integration run separately
# 5. Fail-fast disabled - see all test results
# 6. Shorter timeouts - fail faster on hangs
# 7. Conditional jobs - benchmarks only on main
# 
# Expected improvement: 8min → 4min (50% faster)

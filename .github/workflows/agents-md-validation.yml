name: AGENTS.md Validation

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'ml-agents/**'
      - 'ml-agents-envs/**'
      - '.github/workflows/agents-md-validation.yml'
  push:
    branches:
      - main
      - develop
  schedule:
    # Run weekly to catch drift
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  validate-commands:
    name: Validate AGENTS.md Commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./ml-agents-envs
          pip install -e ./ml-agents
          pip install -r test_requirements.txt
      
      - name: Test build commands
        run: |
          echo "## AGENTS.md Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Commands" >> $GITHUB_STEP_SUMMARY
          
          # Test package installation
          pip list | grep mlagents
          echo "✓ Packages installed successfully" >> $GITHUB_STEP_SUMMARY
      
      - name: Test test commands
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Commands" >> $GITHUB_STEP_SUMMARY
          
          # Test that pytest can collect tests
          pytest --collect-only -q -m "not slow" | head -10
          echo "✓ pytest can collect tests" >> $GITHUB_STEP_SUMMARY
          
          # Verify coverage command works
          pytest --cov=ml-agents --cov=ml-agents-envs --collect-only -q
          echo "✓ Coverage collection works" >> $GITHUB_STEP_SUMMARY
      
      - name: Test training commands
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Training Commands" >> $GITHUB_STEP_SUMMARY
          
          # Verify mlagents-learn is available
          mlagents-learn --help > /dev/null
          echo "✓ mlagents-learn command available" >> $GITHUB_STEP_SUMMARY
          
          # Verify other utilities
          mlagents-push-to-hf --help > /dev/null || echo "mlagents-push-to-hf available"
          mlagents-load-from-hf --help > /dev/null || echo "mlagents-load-from-hf available"
          echo "✓ HuggingFace utilities available" >> $GITHUB_STEP_SUMMARY
      
      - name: Check code quality tools
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Code Quality Tools" >> $GITHUB_STEP_SUMMARY
          
          # Test pre-commit is installed
          pip list | grep pre-commit
          echo "✓ pre-commit available" >> $GITHUB_STEP_SUMMARY
          
          # Test black is available
          python -m black --version
          echo "✓ black formatter available" >> $GITHUB_STEP_SUMMARY
          
          # Test mypy is available
          python -m mypy --version
          echo "✓ mypy type checker available" >> $GITHUB_STEP_SUMMARY
          
          # Test flake8 is available
          python -m flake8 --version
          echo "✓ flake8 linter available" >> $GITHUB_STEP_SUMMARY
      
      - name: Validate documentation accuracy
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Documentation Accuracy" >> $GITHUB_STEP_SUMMARY
          
          # Check that key files mentioned in AGENTS.md exist
          test -f pytest.ini && echo "✓ pytest.ini exists" >> $GITHUB_STEP_SUMMARY
          test -f setup.cfg && echo "✓ setup.cfg exists" >> $GITHUB_STEP_SUMMARY
          test -f .pre-commit-config.yaml && echo "✓ .pre-commit-config.yaml exists" >> $GITHUB_STEP_SUMMARY
          test -f test_requirements.txt && echo "✓ test_requirements.txt exists" >> $GITHUB_STEP_SUMMARY
          
          # Check key directories exist
          test -d ml-agents && echo "✓ ml-agents/ directory exists" >> $GITHUB_STEP_SUMMARY
          test -d ml-agents-envs && echo "✓ ml-agents-envs/ directory exists" >> $GITHUB_STEP_SUMMARY
          test -d config && echo "✓ config/ directory exists" >> $GITHUB_STEP_SUMMARY
          test -d Project && echo "✓ Project/ directory exists" >> $GITHUB_STEP_SUMMARY
      
      - name: Validation Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **AGENTS.md validation complete**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All commands documented in AGENTS.md are verified to work." >> $GITHUB_STEP_SUMMARY

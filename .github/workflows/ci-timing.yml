name: CI Performance Monitor

on:
  workflow_run:
    workflows: ["pytest", "pre-commit", "Build Performance Tracking"]
    types:
      - completed

jobs:
  track-ci-performance:
    name: Track CI Timing
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    steps:
      - name: Calculate workflow duration
        run: |
          START_TIME="${{ github.event.workflow_run.created_at }}"
          END_TIME="${{ github.event.workflow_run.updated_at }}"
          
          START_EPOCH=$(date -d "$START_TIME" +%s)
          END_EPOCH=$(date -d "$END_TIME" +%s)
          DURATION=$((END_EPOCH - START_EPOCH))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))
          
          echo "## CI Performance: ${{ github.event.workflow_run.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Duration | ${MINUTES}m ${SECONDS}s |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ github.event.workflow_run.conclusion }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.event.workflow_run.head_branch }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Performance assessment
          if [ $MINUTES -lt 5 ]; then
            echo "✅ **Fast CI:** Under 5 minutes" >> $GITHUB_STEP_SUMMARY
          elif [ $MINUTES -lt 10 ]; then
            echo "✅ **Acceptable:** Under 10 minutes" >> $GITHUB_STEP_SUMMARY
          elif [ $MINUTES -lt 15 ]; then
            echo "⚠️ **Slow:** Over 10 minutes" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Very Slow:** Over 15 minutes" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Consider optimizing test suite or increasing parallelization." >> $GITHUB_STEP_SUMMARY
          fi

name: pytest

on:
  pull_request:
    paths:  # This action will only run if the PR modifies a file in one of these directories
    - 'ml-agents/**'
    - 'ml-agents-envs/**'
    - 'test_constraints*.txt'
    - 'test_requirements.txt'
    - '.github/workflows/pytest.yml'
  push:
    branches:
     - main
     - develop
     - 'release/**'
  workflow_dispatch:
    inputs:
      pytest_markers:
        description: "Restrict which tests to run based on pytest markers"
        required: false
        default: "not slow"
        type: string
  workflow_call:
    inputs:
      pytest_markers:
        required: false
        # Hacky way to make sure we run all tests
        default: "slow or not slow"
        type: string

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
        TEST_ENFORCE_BUFFER_KEY_TYPES: 1
    strategy:
      # If one test in the matrix fails we still want to run the others.
      fail-fast: false
      matrix:
        python-version: [3.10.12]
        include:
          - python-version: 3.10.12
            pip_constraints: test_constraints_version.txt
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache pip
      uses: actions/cache@v4
      with:
        # This path is specific to Ubuntu
        path: ~/.cache/pip
        # Look to see if there is a cache hit for the corresponding requirements file
        key: ${{ runner.os }}-pip-${{ hashFiles('ml-agents/setup.py', 'ml-agents-envs/setup.py', 'test_requirements.txt', matrix.pip_constraints) }}
        restore-keys: |
          ${{ runner.os }}-pip-
          ${{ runner.os }}-
    - name: Display Python version
      run: python -c "import sys; print(sys.version)"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade setuptools
        python -m pip install --progress-bar=off -e ./ml-agents-envs -c ${{ matrix.pip_constraints }}
        python -m pip install --progress-bar=off -e ./ml-agents -c ${{ matrix.pip_constraints }}
        python -m pip install --progress-bar=off -r test_requirements.txt -c ${{ matrix.pip_constraints }}
        python -m pip install --progress-bar=off -e ./ml-agents-plugin-examples -c ${{ matrix.pip_constraints }}
    - name: Save python dependencies
      run: |
        pip freeze > pip_versions-${{ matrix.python-version }}.txt
        cat pip_versions-${{ matrix.python-version }}.txt
    - name: Get pytest marker
      id: pytest_marker
      run: |
        if [ "${{ github.event.inputs.pytest_markers }}" != "" ]; then
          echo "markers=${{ github.event.inputs.pytest_markers }}" >> $GITHUB_OUTPUT
        else
          echo "markers=not slow" >> $GITHUB_OUTPUT
        fi
    - name: Run pytest (with retry for flaky tests)
      uses: nick-fields/retry@v2
      with:
        timeout_minutes: 30
        max_attempts: 2
        retry_on: error
        command: |
          pytest --cov=ml-agents --cov=ml-agents-envs \
          --cov-report=html --cov-report=xml --junitxml=junit/test-results-${{ matrix.python-version }}.xml \
          -p no:warnings -v -m "${{ steps.pytest_marker.outputs.markers }}" -n 8 \
          --durations=20 --durations-min=1.0
    
    - name: Generate test performance report
      if: always()
      run: |
        echo "## Test Performance Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Slowest 20 Tests" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        pytest --co -q -m "${{ steps.pytest_marker.outputs.markers }}" | head -20 || echo "Test collection info"
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "See full durations in pytest output above" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check for test retries (flaky tests)
        if [ -f junit/test-results-${{ matrix.python-version }}.xml ]; then
          RETRIED=$(grep -c "rerun" junit/test-results-${{ matrix.python-version }}.xml || echo "0")
          if [ "$RETRIED" -gt "0" ]; then
            echo "⚠️ **Flaky Tests Detected:** $RETRIED tests required retry" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **No Flaky Tests:** All tests passed on first attempt" >> $GITHUB_STEP_SUMMARY
          fi
        fi
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.python-version }}
        fail_ci_if_error: false
      if: always()
    
    - name: Upload pytest test results
      uses: actions/upload-artifact@v4
      with:
        name: artifacts-${{ matrix.python-version }}
        path: |
          htmlcov
          coverage.xml
          pip_versions-${{ matrix.python-version }}.txt
          junit/test-results-${{ matrix.python-version }}.xml
      # Use always() to always run this step to publish test results when there are test failures
      if: ${{ always() }}

name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly security scans
    - cron: '0 0 * * 0'

jobs:
  secret-scanning:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scanning
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install detect-secrets
        run: pip install detect-secrets
      
      - name: Run detect-secrets
        run: |
          detect-secrets scan --baseline .secrets.baseline
          if [ $? -ne 0 ]; then
            echo "::error::New secrets detected! Run 'detect-secrets scan --update .secrets.baseline' locally to update baseline."
            exit 1
          fi

  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit safety
      
      - name: Run pip-audit
        run: |
          pip-audit --desc --requirement ml-agents/requirements.txt || true
          pip-audit --desc --requirement ml-agents-envs/requirements.txt || true
      
      - name: Run safety check
        run: |
          safety check --file ml-agents/requirements.txt --json || true
          safety check --file ml-agents-envs/requirements.txt --json || true

  sast-scan:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Bandit
        run: pip install bandit[toml]
      
      - name: Run Bandit Security Scan
        run: |
          bandit -r ml-agents/mlagents ml-agents-envs/mlagents_envs \
            -f json -o bandit-report.json \
            --severity-level medium \
            --confidence-level medium \
            --exclude '*/tests/*,*_pb2.py,*_pb2_grpc.py' || true
      
      - name: Display Bandit Results
        if: always()
        run: |
          if [ -f bandit-report.json ]; then
            cat bandit-report.json | python -m json.tool
          fi
      
      - name: Upload Bandit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, csharp
          queries: security-and-quality
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python,csharp"

  subprocess-security-check:
    name: Subprocess Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for shell=True usage
        run: |
          echo "Checking for dangerous subprocess.call/run/check_call with shell=True..."
          
          # Search for shell=True in subprocess calls
          MATCHES=$(grep -rn "subprocess\.\(call\|run\|check_call\|Popen\).*shell\s*=\s*True" \
            --include="*.py" \
            --exclude-dir=".venv*" \
            --exclude-dir="venv" \
            --exclude-dir="node_modules" \
            . || true)
          
          if [ -n "$MATCHES" ]; then
            echo "::error::Found subprocess calls with shell=True (security vulnerability):"
            echo "$MATCHES"
            echo ""
            echo "These should be refactored to use list arguments instead."
            echo "Example: subprocess.call(['ls', '-la']) instead of subprocess.call('ls -la', shell=True)"
            exit 1
          else
            echo "✓ No shell=True usage found in subprocess calls"
          fi
      
      - name: Check for os.system usage
        run: |
          echo "Checking for os.system calls..."
          
          MATCHES=$(grep -rn "os\.system\(" \
            --include="*.py" \
            --exclude-dir=".venv*" \
            --exclude-dir="venv" \
            . || true)
          
          if [ -n "$MATCHES" ]; then
            echo "::warning::Found os.system calls (potential security risk):"
            echo "$MATCHES"
            echo ""
            echo "Consider using subprocess.run() with list arguments instead."
          fi
      
      - name: Check for eval/exec usage
        run: |
          echo "Checking for eval/exec calls in non-test code..."
          
          MATCHES=$(grep -rn "\(eval\|exec\)\(" \
            --include="*.py" \
            --exclude-dir=".venv*" \
            --exclude-dir="venv" \
            --exclude-dir="tests" \
            ml-agents/mlagents ml-agents-envs/mlagents_envs || true)
          
          if [ -n "$MATCHES" ]; then
            echo "::warning::Found eval/exec usage (potential security risk):"
            echo "$MATCHES"
          fi
